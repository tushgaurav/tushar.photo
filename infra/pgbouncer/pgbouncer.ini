;; PgBouncer for tushar.photo
;;
;; Sits between Vercel's serverless functions and RDS Postgres. Vercel opens a
;; new TCP connection per function invocation, which exhausts RDS's connection
;; limit without a pooler in front.
;;
;; Deploy to /etc/pgbouncer/pgbouncer.ini. See README.md in this directory.

[databases]
;; Replace RDS_ENDPOINT with the real instance endpoint.
;; The password is NOT here; PgBouncer forwards the client's credentials.
tushar_photo = host=RDS_ENDPOINT port=5432 dbname=tushar_photo

[pgbouncer]

;; ---------------------------------------------------------------------------
;; Listener
;; ---------------------------------------------------------------------------
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; ---------------------------------------------------------------------------
;; Pooling
;; ---------------------------------------------------------------------------
;; transaction mode is what makes this useful for serverless: a server
;; connection is returned to the pool at COMMIT rather than being held for the
;; client's whole session. The tradeoff is that session-level state
;; (prepared statements, LISTEN/NOTIFY, session GUCs, advisory locks) does not
;; survive between transactions, which is why the app sets `prepare: false`.
pool_mode = transaction

max_client_conn = 1000
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Recycle backend connections so a long-lived pool cannot pin stale state.
server_lifetime = 3600
server_idle_timeout = 600

;; Keep prepared-statement emulation off. PgBouncer >= 1.21 can track them in
;; transaction mode, but the app disables them client-side, so leaving this at
;; 0 keeps behaviour unambiguous.
max_prepared_statements = 0

;; postgres.js sends these on connect; PgBouncer rejects unknown startup
;; parameters unless they are listed here.
ignore_startup_parameters = extra_float_digits,options,search_path

;; ---------------------------------------------------------------------------
;; TLS: client side (Vercel -> PgBouncer)
;; ---------------------------------------------------------------------------
;; Vercel Hobby has no static egress IPs, so the security group for port 6432
;; cannot be restricted to known addresses. TLS plus scram-sha-256 is therefore
;; the only thing protecting this listener. `require` refuses plaintext.
client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/tls/privkey.pem
client_tls_cert_file = /etc/pgbouncer/tls/fullchain.pem

;; ---------------------------------------------------------------------------
;; TLS: server side (PgBouncer -> RDS)
;; ---------------------------------------------------------------------------
;; verify-full checks the RDS certificate chain AND that the hostname matches,
;; which prevents a DNS-level redirect from silently intercepting traffic.
server_tls_sslmode = verify-full
server_tls_ca_file = /etc/pgbouncer/tls/rds-global-bundle.pem

;; ---------------------------------------------------------------------------
;; Admin / logging
;; ---------------------------------------------------------------------------
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin

logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /run/pgbouncer/pgbouncer.pid

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
